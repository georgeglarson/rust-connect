[package]
name = "rust-connect"
version = "0.2.0"
edition = "2021"
# Verified floor: `cargo +1.91.0 check --locked` passes. Enforced by the
# msrv job in .github/workflows/ci.yml, so raising it is a deliberate act
# rather than a silent drift.
rust-version = "1.91"
authors = ["George Larson <georgeglarson@users.noreply.github.com>"]
description = "A modern, API-first reimplementation of KDE Connect in Rust"
license = "GPL-2.0-or-later"
repository = "https://github.com/georgeglarson/rust-connect"
readme = "README.md"
keywords = ["kdeconnect", "android", "sync", "api"]
categories = ["network-programming", "api-bindings"]

[features]
test-helpers = []

[dependencies]
# Async runtime
tokio = { version = "1.19.1", features = ["net", "fs", "process", "sync", "time", "rt-multi-thread", "macros", "io-util", "signal", "signal-hook-registry"] }
tokio-util = "0.7"

# Web framework
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TLS (rustls + ring, TLSv1.2 pinned to match Android/Conscrypt — interop
# proven live both roles 2026-07-29 by examples/tls_probe.rs).
# NOTE: tls12 is NOT a rustls default feature under default-features=false;
# KDE Connect pins TLSv1.2, so omitting it is a silent interop break (this is
# the suspected root cause of the 2026-04-05 NO_SHARED_CIPHER incident).
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-pki-types = { version = "1", features = ["alloc"] }
# Desktop notifications
notify-rust = "4"

# Session D-Bus for the MPRIS plugin (org.mpris.MediaPlayer2.* control).
# zbus 5.14 is already in the tree as a notify-rust transitive dependency, so
# this adds no new transitive crates.
zbus = "5"

# Process-group kill for runcommand timeout (killpg). Already in the tree as
# a transitive dependency of half the stack, so this adds no new crates.
libc = "0.2"

# Logging: `tracing` with an `event = "…"` field vocabulary. Under systemd
# the sink is journald (tracing-journald), so those fields are journal
# fields (`journalctl --user -u rust-connect EVENT=battery_update`); on a
# terminal it is text; LOG_FORMAT=json selects JSON lines.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-journald = "0.3"

# OpenAPI generation (AI-friendly documentation)
utoipa = { version = "4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }

# Configuration (TOML only; the `config` crate was a 54-crate subtree with
# zero uses — 2026-09-06 audit D1)
toml = "1.1"

# Error handling
thiserror = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# CLI client mode: blocking HTTP for the localhost REST API. No TLS features
# (the API is plain HTTP on loopback) — keeps native-tls/openssl out of
# production deps.
ureq = { version = "3", default-features = false }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

# Crypto
rand = "0.8"
hex = "0.4"
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
x509-parser = "0.18"
sha2 = "0.11"
base64 = "0.23"

# System utilities
hostname = "0.4"
dirs = "7.0.0"
tokio-stream = { version = "0.1.18", features = ["sync"] }
socket2 = "0.6.3"
# mDNS (DNS-SD) discovery: pure-Rust responder + browser, no system avahi.
mdns-sd = "0.20"
# Network interface/address change watching (Task 2.2, vk #994): purpose-
# built for exactly this (used by libp2p et al.), tokio-native — no
# competing async runtime. On Linux it's a thin wrapper over rtnetlink;
# using it directly instead of hand-rolling netlink message parsing keeps
# the marginal dependency footprint to 7 new crates (if-watch,
# netlink-{packet-core,packet-route,proto,sys}, rtnetlink, paste) — see
# plans/task-2.2-report.md for the alternatives considered and the
# dependency-tree diff that backs this pick.
if-watch = { version = "3", default-features = false, features = ["tokio"] }
tracing-appender = "0.2.4"
evdev = "0.13"
moka = { version = "0.12", features = ["sync"] }
async-trait = "0.1.89"
tempfile = "3"

# shareinputdevices M3 EI transport. reis is the pure-Rust libei/libeis
# binding; the lan-mouse upstream uses ashpd+reis for the same portal half
# we drive from raw zbus. xkbcommon wraps libxkbcommon for keysym/modifier
# lookup (the cpp producer at inputcapturesession.cpp:43-89 mirrors this
# directly).
reis = { version = "0.7.1", default-features = false, features = ["tokio"] }
xkbcommon = "0.9"
# reis re-exports enumflags2 (`pub use enumflags2;` at lib.rs:38), so
# `BitFlags` is reachable as `reis::enumflags2::BitFlags` without a
# direct dep on enumflags2. `futures` (above) re-exports the StreamExt
# the EiConvertEventStream needs.

[dev-dependencies]
rust-connect = { path = ".", features = ["test-helpers"] }

# Testing
# `test-util` gives the suite `tokio::time::pause()` / `start_paused`. It
# used to arrive transitively through `tokio-test`, whose own API nothing
# called (2026-09-06 audit D2); name the feature we actually rely on.
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
criterion = "0.5"
proptest = "1"
uuid = { version = "1", features = ["v4"] }
openssl = "0.10"

# examples/tls_probe.rs (kept as the live interop harness; rustls itself is
# now a production dependency above)
sha2 = "0.11"
anyhow = "1.0.104"

[[bench]]
name = "packet_serialization"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
