# kdeconnect-android plugin inventory
#
# upstream_repo: https://invent.kde.org/network/kdeconnect-android
# pinned_commit: a88f6fa0000773dd3fd0787640ad9c4dfb4af681
# extraction_date: 2026-08-05
# field_key: incoming_packet_types = packet types this plugin handles
# field_key: outgoing_packet_types = packet types this plugin emits
# extraction notes:
# - Kotlin plugins declare `override val supportedPacketTypes` / `outgoingPacketTypes`
#   in either `= arrayOf(...)` (single- or multi-line) or `get() = arrayOf(...)` form.
# - Java plugins declare `public @NonNull String[] getSupportedPacketTypes()` / `getOutgoingPacketTypes()`.
# - Only `const val PACKET_TYPE_*` / `String PACKET_TYPE_*` declarations are treated as packet type constants; other identifiers and strings are discarded to avoid body-field noise.
# - Roles are the plugin directory names; alignment with rust-connect and kdeconnect-kde is deferred to Sprint 3 (Task 3.1).
plugins:
  - role: battery
    source_file: src/main/java/org/kde/kdeconnect/plugins/battery/BatteryPlugin.kt
    incoming_packet_types:
      - kdeconnect.battery
    outgoing_packet_types:
      - kdeconnect.battery
  - role: clipboard
