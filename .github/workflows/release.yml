name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        # libssl-dev is only needed for dev-dependencies (openssl in test fixtures);
        # the production binary no longer uses openssl.
        # libdbus-1-dev is needed for zbus (MPRIS, notifications).
        # libxkbcommon-dev is linked at build time by the xkbcommon crate
        # (shareinputdevices M3 keysym/modifier lookup, raw FFI, no pkg-config).
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libdbus-1-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Build and Package .deb
        run: |
          ./packaging/build-deb.sh amd64

      - name: Generate SHA256 checksums
        # Record basenames only: release downloads are flattened, so
        # `sha256sum -c SHA256SUMS` must resolve the files in CWD.
        run: |
          cp target/x86_64-unknown-linux-gnu/release/rust-connect .
          cp packaging/*.deb .
          sha256sum rust-connect *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            packaging/*.deb
            target/x86_64-unknown-linux-gnu/release/rust-connect
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
